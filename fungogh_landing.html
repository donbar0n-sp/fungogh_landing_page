<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fungogh - Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Roboto:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body {
          margin: 0;
          padding: 0;
          background: linear-gradient(to bottom right, #0f0f1f, #1f2f3f);
          font-family: 'Roboto', sans-serif;
          color: #f5f5f5;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          height: 100vh;
          text-align: center;
          overflow: hidden;
        }

        h1 {
          font-family: 'Poiret One', cursive;
          font-size: 3.5rem;
          margin-bottom: 0.5rem;
          background: linear-gradient(90deg, #eacda3, #d6ae7b);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        p {
          font-size: 1.25rem;
          opacity: 0.8;
        }

        .starry-bg {
          background: url('https://upload.wikimedia.org/wikipedia/commons/e/ee/The_Starry_Night.jpg');
          background-size: cover;
          background-repeat: no-repeat;
          background-position: center;
          position: fixed;
          top: 0; left: 0; right: 0; bottom: 0;
          z-index: -1;
          filter: brightness(0.2) blur(4px);
          opacity: 0.3;
        }

        .logo-glow {
          font-size: 1rem;
          margin-top: 2rem;
          color: #66ffcc;
          opacity: 0.7;
          letter-spacing: 2px;
          text-transform: uppercase;
        }
    </style>
</head>
<body>
<div class="starry-bg"></div>
<h1>Fungogh</h1>
<p>Coming Soon</p>
<div class="logo-glow">AI. Creativity. Reimagined.</div>
</body>
</html>
