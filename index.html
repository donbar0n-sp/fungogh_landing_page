<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fungogh - Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Roboto:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body {
          margin: 0;
          padding: 0;
          font-family: 'Roboto', sans-serif;
          background: #0f0f1f;
          color: #f5f5f5;
          height: 100vh;
          overflow: hidden;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          text-align: center;
          position: relative;
        }

        h1 {
          font-family: 'Poiret One', cursive;
          font-size: 4rem;
          margin-bottom: 0.5rem;
          background: linear-gradient(90deg, #eacda3, #d6ae7b);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          z-index: 2;
        }

        p {
          font-size: 1.5rem;
          opacity: 0.85;
          z-index: 2;
        }

        .logo-glow {
          margin-top: 2rem;
          font-size: 1rem;
          color: #66ffcc;
          opacity: 0.8;
          letter-spacing: 2px;
          text-transform: uppercase;
          z-index: 2;
        }

        .van-gogh-bg {
          background-image: url('assets/starry-bg.webp');
          background-size: cover;
          background-position: center;
          filter: brightness(0.6) blur(4px);
          position: absolute;
          top: 0; left: 0; right: 0; bottom: 0;
          z-index: 0;
          transition: filter 0.2s ease-out; /* smoother transition */
        }

        .floating-stars {
          position: absolute;
          top: 0; left: 0; width: 100%; height: 100%;
          pointer-events: none;
          z-index: 1; /* Above background, below text */
        }

        .star {
          position: absolute;
          width: 4px;
          height: 4px;
          background: white;
          border-radius: 50%;
          opacity: 0.7;
          animation: drift 20s infinite linear;
        }

        @keyframes drift {
          0% { transform: translateY(0) translateX(0); }
          50% { transform: translateY(-20px) translateX(10px); }
          100% { transform: translateY(0) translateX(0); }
        }
    </style>
</head>
<body>
<div class="van-gogh-bg"></div>

<!-- Floating stars layer -->
<div class="floating-stars">
  <div class="star" style="top: 20%; left: 10%; animation-duration: 18s;"></div>
  <div class="star" style="top: 50%; left: 70%; animation-duration: 22s;"></div>
  <div class="star" style="top: 80%; left: 30%; animation-duration: 25s;"></div>
  <div class="star" style="top: 35%; left: 85%; animation-duration: 20s;"></div>
  <div class="star" style="top: 60%; left: 50%; animation-duration: 24s;"></div>
</div>

<h1>Fungogh</h1>
<p id="typewriter"></p>
<div class="logo-glow">AI. Creativity. Reimagined.</div>

<script>
    // Typewriter effect
    const text = "Coming Soon";
    let i = 0;
    const speed = 80;
    const target = document.getElementById("typewriter");
    function typeWriter() {
      if (i < text.length) {
        target.innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, speed);
      }
    }
    typeWriter();

    // Parallax + dynamic blur + brightness
    document.addEventListener("mousemove", (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 10;
      const y = (e.clientY / window.innerHeight - 0.5) * 10;

      const distanceFromCenter = Math.abs((e.clientX / window.innerWidth) - 0.5) * 2;
      const blur = 6 - distanceFromCenter * 3;

      const brightness = 0.6 + (e.clientY / window.innerHeight) * 0.1; 

      const bg = document.querySelector('.van-gogh-bg');
      bg.style.transform = `translate(${x}px, ${y}px)`;
      bg.style.filter = `brightness(${brightness}) blur(${blur}px)`;
    });
</script>
</body>
</html>
