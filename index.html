<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fungogh - Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Roboto:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body {
          margin: 0;
          padding: 0;
          font-family: 'Roboto', sans-serif;
          background: #0f0f1f;
          color: #f5f5f5;
          height: 100vh;
          overflow: hidden;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          text-align: center;
          position: relative;
        }

        h1 {
          font-family: 'Poiret One', cursive;
          font-size: 4rem;
          margin-bottom: 0.5rem;
          background: linear-gradient(90deg, #eacda3, #d6ae7b);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          z-index: 2;
        }

        p {
          font-size: 1.5rem;
          opacity: 0.85;
          z-index: 2;
        }

        .logo-glow {
          margin-top: 2rem;
          font-size: 1rem;
          color: #66ffcc;
          opacity: 0.8;
          letter-spacing: 2px;
          text-transform: uppercase;
          z-index: 2;
        }

        .van-gogh-bg {
          background-image: url('assets/starry-bg.webp');
          background-size: cover;
          background-position: center;
          filter: brightness(0.6) blur(4px);
          position: absolute;
          top: 0; left: 0; right: 0; bottom: 0;
          z-index: 0;
        }

        .parallax-layer {
          position: absolute;
          top: 0; left: 0; width: 100%; height: 100%;
          background-repeat: no-repeat;
          background-size: cover;
          opacity: 0.05;
          pointer-events: none;
        }
    </style>
</head>
<body>
<div class="van-gogh-bg"></div>
<h1>Fungogh</h1>
<p id="typewriter"></p>
<div class="logo-glow">AI. Creativity. Reimagined.</div>

<script>
    // Typewriter effect
    const text = "Coming Soon";
    let i = 0;
    const speed = 80;
    const target = document.getElementById("typewriter");
    function typeWriter() {
      if (i < text.length) {
        target.innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, speed);
      }
    }
    typeWriter();

    // Parallax effect
    document.addEventListener("mousemove", (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 10;
      const y = (e.clientY / window.innerHeight - 0.5) * 10;
      document.querySelector('.van-gogh-bg').style.transform = `translate(${x}px, ${y}px)`;
    });

    // Twinkling stars effect
    document.addEventListener("mousemove", (e) => {
      const brightness = 0.5 + (e.clientY / window.innerHeight) * 0.1;
      const blur = 3 + (e.clientX / window.innerWidth) * 2;

      document.querySelector('.van-gogh-bg').style.filter = `brightness(${brightness}) blur(${blur}px)`;
    });
</script>
</body>
</html>
