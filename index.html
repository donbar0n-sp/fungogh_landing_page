<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fungogh - Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Roboto:wght@300;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      background: #0f0f1f;
      color: #f5f5f5;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    h1 {
      font-family: 'Poiret One', cursive;
      font-size: 4rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #eacda3, #d6ae7b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      z-index: 3;
    }

    p {
      font-size: 1.5rem;
      opacity: 0.85;
      z-index: 3;
    }

    .logo-glow {
      margin-top: 2rem;
      font-size: 1rem;
      color: #66ffcc;
      opacity: 0.8;
      letter-spacing: 2px;
      text-transform: uppercase;
      z-index: 3;
    }

    .van-gogh-bg {
      background-image: url('assets/starry-bg.webp');
      background-size: cover;
      background-position: center;
      filter: brightness(0.6) blur(4px);
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
    }

    /* 🌟 Star Hotspot + Glow */
    .star-hotspot {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 2;
    }

    .glow {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255,230,150,0.5) 0%, rgba(255,230,150,0) 70%);
      opacity: 0.7;
      filter: blur(10px);
      transition: all 0.3s ease-out;
      pointer-events: none;
      animation: pulse 4s infinite ease-in-out;
    }

    .star-hotspot:hover .glow {
      opacity: 1;
      filter: blur(2px);
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 0.9; }
    }
  </style>
</head>
<body>
<div class="van-gogh-bg"></div>

<!-- 🌟 Star Hotspots (now with size adjustments!) -->
<div class="star-hotspot" style="top: 3%; left: 18%; width: 100px; height: 100px;"> 
  <div class="glow"></div>
</div>
<div class="star-hotspot" style="top: 20%; left: 58%; width: 140px; height: 140px;">
  <div class="glow"></div>
</div>
<div class="star-hotspot" style="top: 14%; left: 78%; width: 360px; height: 360px;">
  <div class="glow"></div>
</div>
<div class="star-hotspot" style="top: 60%; left: 24%; width: 200px; height: 200px;">
  <div class="glow"></div>
</div>
<div class="star-hotspot" style="top: 0%; left: 50%; width: 160px; height: 160px;">
  <div class="glow"></div>
</div>
<div class="star-hotspot" style="top: 36%; left: 23%; width: 80px; height: 80px;">
  <div class="glow"></div>
</div>

<h1>Fungogh</h1>
<p id="typewriter"></p>
<div class="logo-glow">AI. Creativity. Reimagined.</div>

<script>
  // Typewriter effect
  const text = "Coming Soon";
  let i = 0;
  const speed = 80;
  const target = document.getElementById("typewriter");
  function typeWriter() {
    if (i < text.length) {
      target.innerHTML += text.charAt(i);
      i++;
      setTimeout(typeWriter, speed);
    }
  }
  typeWriter();

  // Parallax effect
  document.addEventListener("mousemove", (e) => {
    const x = (e.clientX / window.innerWidth - 0.5) * 10;
    const y = (e.clientY / window.innerHeight - 0.5) * 10;
    document.querySelector('.van-gogh-bg').style.transform = `translate(${x}px, ${y}px)`;
  });
</script>
</body>
</html>
